services:
  - type: web
    name: lawscan
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    pythonVersion: 3.10.13
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
